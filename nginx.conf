server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # kept out of search engines while the content is checked; matches the robots meta tag in index.html
    add_header X-Robots-Tag "noindex" always;

    # file names carry a content hash
    location /assets/ {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # the screen checks for updates by reloading, so the page itself is never cached
    location / {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
